<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-box">
        <div class="top-icons">
            <span class="icon-badge" title="Perlindungan Diri"><i class="fas fa-shield-halved"></i></span>
            <span class="icon-badge outline" title="Generasi Sehat"><i class="fas fa-seedling"></i></span>
        </div>

        <h2>CREATE ACCOUNT</h2>
        <p class="subtitle">Daftar untuk mulai menggunakan layanan kami.</p>

        <form id="registerForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Username" required>
            </div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
                <i class="fas fa-eye toggle-eye" id="togglePassword"></i>
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">
                <span>Register</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <p class="switch-link">
                Already have an account? <a href="index.html">Login</a>
            </p>
        </form>
    </div>

    <script src="register.js"></script>
</body>
</html>
