<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Edukasi Anti Narkoba</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-box">
        <div class="top-icons">
            <span class="icon-badge" title="Perlindungan Diri"><i class="fas fa-shield-halved"></i></span>
            <span class="icon-badge outline" title="Generasi Sehat"><i class="fas fa-seedling"></i></span>
        </div>

        <h2>RESET PASSWORD</h2>
        <p class="subtitle" id="formSubtitle">Masukkan email terdaftar untuk menerima kode verifikasi OTP.</p>

        <!-- Form Tahap 1: Meminta Email untuk Kirim OTP -->
        <form id="sendOtpForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="resetEmail" placeholder="Email Terdaftar" required>
            </div>

            <div id="sendOtpMessage" style="font-size: 12.5px; margin-bottom: 15px; text-align: center; display: none;"></div>

            <button type="submit" class="auth-btn" id="sendOtpBtn">
                <span>Kirim Kode Verifikasi</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <!-- Form Tahap 2: Input Kode OTP dan Password Baru (Awalnya Disembunyikan) -->
        <form id="verifyResetForm" style="display: none; margin-top: 10px;">
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="text" id="otpCode" placeholder="Kode OTP 4 Digit" maxlength="4" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="newPassword" placeholder="Password Baru" required>
                <i class="fas fa-eye toggle-eye" id="toggleResetPassword"></i>
            </div>

            <div id="resetMessage" style="font-size: 12.5px; margin-bottom: 15px; text-align: center; display: none;"></div>

            <button type="submit" class="auth-btn" id="resetBtn">
                <span>Ubah Password</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <!-- Fitur Tambahan: Hitung Mundur Resend OTP -->
            <div id="resendSection" style="text-align: center; margin-top: 15px; font-size: 12px; color: rgba(255,255,255,0.7);">
                Belum menerima kode? <span id="timerText">Kirim ulang dalam <b id="countdown">60</b> detik</span>
                <button id="resendBtn" type="button" style="background:none; border:none; color:#ff9e9e; cursor:pointer; display:none; font-weight:bold; font-family:'Poppins', sans-serif;" onclick="resendOtp()">Kirim Ulang</button>
            </div>
        </form>

        <p class="switch-link" style="margin-top: 24px;">
            Ingat password Anda? <a href="index.html">Login</a>
        </p>
    </div>

    <script>
        let targetEmail = '';
        let countdownInterval;

        // Toggle Show/Hide Password Baru
        const toggleResetPassword = document.getElementById('toggleResetPassword');
        const newPasswordInput = document.getElementById('newPassword');
        if (toggleResetPassword && newPasswordInput) {
            toggleResetPassword.addEventListener('click', () => {
                const isHidden = newPasswordInput.type === 'password';
                newPasswordInput.type = isHidden ? 'text' : 'password';
                toggleResetPassword.classList.toggle('fa-eye');
                toggleResetPassword.classList.toggle('fa-eye-slash');
            });
        }

        function startTimer() {
            let timeLeft = 60;
            const countdownEl = document.getElementById('countdown');
            const timerText = document.getElementById('timerText');
            const resendBtn = document.getElementById('resendBtn');
            
            timerText.style.display = 'inline';
            resendBtn.style.display = 'none';

            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    timerText.style.display = 'none';
                    resendBtn.style.display = 'inline';
                }
            }, 1000);
        }

        async function resendOtp() {
            const messageBox = document.getElementById('resetMessage');
            try {
                const response = await fetch('http://localhost:5000/api/send-reset-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: targetEmail })
                });
                if (response.ok) {
                    messageBox.style.display = 'block';
                    messageBox.style.color = '#4CAF50';
                    messageBox.textContent = 'Kode OTP baru berhasil dikirim ulang ke email!';
                    startTimer();
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Tahap 1: Kirim Kode OTP ke Email
        document.getElementById('sendOtpForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            targetEmail = document.getElementById('resetEmail').value;
            const messageBox = document.getElementById('sendOtpMessage');
            const sendBtn = document.getElementById('sendOtpBtn');

            messageBox.style.display = 'none';
            sendBtn.querySelector('span').textContent = 'Mengirim OTP...';
            sendBtn.disabled = true;

            try {
                const response = await fetch('http://localhost:5000/api/send-reset-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: targetEmail })
                });

                const data = await response.json();
                messageBox.style.display = 'block';

                if (response.ok) {
                    messageBox.style.color = '#4CAF50';
                    messageBox.textContent = data.message;
                    
                    // Transisi ke Form Tahap 2
                    document.getElementById('sendOtpForm').style.display = 'none';
                    document.getElementById('verifyResetForm').style.display = 'block';
                    document.getElementById('formSubtitle').textContent = 'Masukkan kode OTP 4 digit & password baru Anda.';
                    startTimer();
                } else {
                    messageBox.style.color = '#ff6b6b';
                    messageBox.textContent = data.error || 'Gagal mengirim kode.';
                    sendBtn.querySelector('span').textContent = 'Kirim Kode Verifikasi';
                    sendBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                messageBox.style.display = 'block';
                messageBox.style.color = '#ff6b6b';
                messageBox.textContent = 'Tidak dapat terhubung ke server backend.';
                sendBtn.querySelector('span').textContent = 'Kirim Kode Verifikasi';
                sendBtn.disabled = false;
            }
        });

        // Tahap 2: Verifikasi OTP & Ubah Password
        document.getElementById('verifyResetForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const code = document.getElementById('otpCode').value;
            const newPassword = document.getElementById('newPassword').value;
            const messageBox = document.getElementById('resetMessage');
            const resetBtn = document.getElementById('resetBtn');

            messageBox.style.display = 'none';
            resetBtn.querySelector('span').textContent = 'Memproses...';
            resetBtn.disabled = true;

            try {
                const response = await fetch('http://localhost:5000/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: targetEmail, code, newPassword })
                });

                const data = await response.json();
                messageBox.style.display = 'block';

                if (response.ok) {
                    messageBox.style.color = '#4CAF50';
                    messageBox.textContent = data.message;
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    messageBox.style.color = '#ff6b6b';
                    messageBox.textContent = data.error || 'Gagal mereset password.';
                    resetBtn.querySelector('span').textContent = 'Ubah Password';
                    resetBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                messageBox.style.display = 'block';
                messageBox.style.color = '#ff6b6b';
                messageBox.textContent = 'Tidak dapat terhubung ke server backend.';
                resetBtn.querySelector('span').textContent = 'Ubah Password';
                resetBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
